kind = "web"
previewPath = "/"
title = "MarketPilot Paper Trading"
description = "Una dashboard mobile-first per paper trading multi-asset con radar di opportunità, strategie quantitative indipendenti, portafogli virtuali separati e metriche P&L nette realistiche. La V1 è esclusivamente simulativa e usa dati demo verificabili, senza broker o ordini reali."
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]
serve = "static"
publicDir = "artifacts/web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22333"
BASE_PATH = "/"
